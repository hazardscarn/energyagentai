    type: wrapper
    agents: [root_agent.3]
    params:
      wrapper: FunctionTool
      wraps: analyze_sales_promoting_factors
      description: "Analyze factors that PROMOTE sales for a specific product using SHAP.\n\nArgs:\n    customer_id: Customer\
        \ identifier\n    sql_query: SQL query that returns customer data\n    product_model_name: ML model name (e.g., 'crosssell_hvac')\n\
        \    \nReturns:\n    str: SHAP analysis of factors that increase sales probability"
  analyze_tou_plan_fit:
