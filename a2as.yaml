        \ drive model predictions.\n\nArgs:\n    sql_query: SQL query that returns customer data with all columns (SELECT\
        \ *)\n    model_name: Model to analyze (churn, crosssell_hvac, crosssell_insurance, \n               crosssell_solar,\
        \ upsell_green_plan, upsell_efficiency_analysis, \n               upsell_surge_protection)\n    target_event: \"positive\"\
        \ for factors that increase probability, \n                 \"negative\" for protective factors\n\nReturns:\n    str:\
        \ Detailed SHAP analysis report with contributing factors"
