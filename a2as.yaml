        - Usage trend analysis\n- Phantom load detection\n- Peak efficiency assessment\n- Personalized recommendations based\
        \ on actual patterns\n\nArgs:\n    customer_id: Customer ID to analyze (e.g., 'CUST000001')\n    analysis_days: Maximum\
        \ days to analyze (default: 365)\n    \nReturns:\n    JSON string with comprehensive personalized energy efficiency\
        \ analysis"
  analyze_ml_model:
    type: wrapper
    agents: [ml_analysis_agent]
