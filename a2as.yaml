manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: hazardscarn/energyagentai
    source: https://github.com/hazardscarn/energyagentai
    branch: main
    commit: "5820b6f5"
    scope: [energy_efficiency/agent copy.py, energy_efficiency/agent.py, energy_efficiency/config.py, energy_efficiency/energy_analysis_tools
        copy.py, energy_efficiency/energy_analysis_tools.py, main_agent/agent.py, main_agent_app.py, marketing_agent/agent.py,
      marketing_agent/config.py, marketing_agent/marketing_content_tools.py, portfolio_manager/__init__.py, portfolio_manager/agent.py,
      portfolio_manager/config.py, portfolio_manager/evaluation/create_test_cases.py, portfolio_manager/evaluation/run_evaluation.py,
      portfolio_manager/subtools.py, retention_agent/__init__.py, retention_agent/agent.py, retention_agent/config.py, retention_agent/retention_content_tools.py,
      retention_agent/subtools.py, sales_agent/__init__.py, sales_agent/agent.py, sales_agent/config.py, sales_agent/sales_content_tools.py,
      sales_agent/subtools.py, shared_tools/__init__.py, shared_tools/mlagent.py, shared_tools/simple_sql_agents.py, shared_tools/visualization_agent.py,
      visualization_agent/__init__.py, visualization_agent/agent.py, visualization_agent/subtools.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:38:35Z'
