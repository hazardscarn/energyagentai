    agents: [root_agent.4, tou_specialist.0, agent.create_comprehensive_energy_agent.1, tou_specialist.1]
    params:
      description: "ADK Tool: Analyze customer's fit for 8PM-8AM TOU (Time of Use) plan\n\nThis tool analyzes a customer's\
        \ energy usage pattern using all available data\nOR the last 365 days (whichever is smaller) to determine if they\
        \ would benefit \nfrom a Time of Use plan where nighttime (8PM-8AM) usage is free and\ndaytime (8AM-8PM) usage costs\
        \ twice the normal rate.\n\nArgs:\n    customer_id: Customer ID to analyze (e.g., 'CUST000001')\n    analysis_days:\
        \ Maximum days to analyze (default: 365)\n    \nReturns:\n    JSON string with TOU plan fit analysis and recommendations"
